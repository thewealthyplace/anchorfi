[project]
; AnchorFi protocol configuration for Clarinet
name = 'anchorfi'
description = 'Bitcoin-anchored lending protocol on Stacks'
authors = []
telemetry = true
cache_dir = './.cache'
requirements = []

[contracts.sip010-trait]
path = 'contracts/sip010-trait.clar'
clarity_version = 3
epoch = 3.1

[contracts.oracle]
path = 'contracts/oracle.clar'
clarity_version = 3
epoch = 3.1

[contracts.ausd-token]
path = 'contracts/ausd-token.clar'
clarity_version = 3
epoch = 3.1

[contracts.collateral-vault]
path = 'contracts/collateral-vault.clar'
clarity_version = 3
epoch = 3.1

[contracts.liquidation]
path = 'contracts/liquidation.clar'
clarity_version = 3
epoch = 3.1

[contracts.lending-pool]
path = 'contracts/lending-pool.clar'
clarity_version = 3
epoch = 3.1

[repl.analysis]
passes = ['check_checker']

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false

[repl.remote_data]
enabled = false
api_url = 'https://api.hiro.so'
